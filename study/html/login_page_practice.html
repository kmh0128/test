<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>로그인 창</title>
</head>
<body>
    <div>
        <h1>로그인 페이지</h1>
        <form>
            <label for="ID">
                <input type="text" placeholder="ID 아이디" id="ID">
            </label>
            <label for="pw">
                <input type="password" placeholder="password 비밀번호" id="pw">
            </label>
            <label for="Id_save">
                <input type="checkbox" id="Id_save">아이디 저장
            </label>
            <button>로그인(login)</button>
        </form>
        <a href="#">아이디와 비밀번호 잊어버린 경우</a>
    </div>
</body>
</html>
